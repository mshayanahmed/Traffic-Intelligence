<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sign in — Traffic Intelligence</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230B1217'/%3E%3Ctext x='16' y='21' font-family='sans-serif' font-size='13' font-weight='700' fill='%2324C0C0' text-anchor='middle'%3ETI%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/styles.css">
<style>
  body {
    min-height: 100vh;
    display: grid;
    place-items: center;
    background:
      repeating-linear-gradient(0deg, rgba(36,192,192,.05) 0 1px, transparent 1px 44px),
      repeating-linear-gradient(90deg, rgba(36,192,192,.05) 0 1px, transparent 1px 44px),
      linear-gradient(180deg, #0B1217 0%, #081015 100%);
    padding: 24px;
  }
  .auth-card {
    width: 100%;
    max-width: 400px;
    background: var(--bg-surface);
    border: 1px solid var(--border-subtle);
    border-radius: var(--radius-card);
    box-shadow: 0 16px 48px rgba(0, 0, 0, .45);
    overflow: hidden;
  }
  .auth-head {
    padding: 28px 28px 20px;
    display: flex; align-items: center; gap: 12px;
  }
  .auth-head .brand-mark { width: 42px; height: 42px; font-size: 17px; }
  .auth-head h1 { font-size: 20px; font-weight: 700; letter-spacing: -.01em; }
  .auth-head small {
    display: block;
    font-size: 10px; font-weight: 600;
    letter-spacing: .08em; text-transform: uppercase;
    color: var(--text-secondary);
  }
  .auth-body { padding: 0 28px 28px; display: flex; flex-direction: column; gap: 14px; }
  .field label {
    display: block;
    font-size: 11px; font-weight: 600;
    letter-spacing: .08em; text-transform: uppercase;
    color: var(--text-secondary);
    margin-bottom: 6px;
  }
  .field input {
    width: 100%;
    font-size: 14px;
    padding: 10px 12px;
    border: 1px solid var(--border-subtle);
    border-radius: var(--radius-control);
    background: var(--bg-surface);
    color: var(--text-primary);
  }
  .field input:focus { outline: 2px solid var(--brand-teal); outline-offset: -1px; }
  #authSubmit { width: 100%; padding: 11px; font-weight: 600; }
  .auth-switch { text-align: center; font-size: 13px; color: var(--text-secondary); }
  .auth-switch button {
    background: none; border: 0;
    color: var(--brand-teal-text);
    font-size: 13px; font-weight: 600;
    cursor: pointer;
  }
  #authError {
    display: none;
    padding: 10px 12px;
    border-radius: var(--radius-control);
    background: var(--tint-red);
    color: var(--accent-red);
    font-size: 13px;
    border-left: 3px solid var(--accent-red);
  }
  .auth-note {
    margin-top: 18px;
    text-align: center;
    font-size: 12px;
    color: #8FA3A6;
  }
</style>
</head>
<body>

<div>
  <div class="auth-card">
    <div class="auth-head">
      <div class="brand-mark">TI</div>
      <div>
        <small>AI OPERATIONS / ACCESS</small>
        <h1 id="authTitle">Sign in</h1>
      </div>
    </div>
    <form class="auth-body" id="authForm">
      <div id="authError" role="alert"></div>
      <div class="field">
        <label for="username">Username</label>
        <input id="username" type="text" autocomplete="username" required minlength="3">
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" type="password" autocomplete="current-password" required minlength="6">
      </div>
      <button id="authSubmit" class="button primary" type="submit">Sign in</button>
      <div class="auth-switch">
        <span id="switchLabel">No account yet?</span>
        <button type="button" id="switchMode">Create one</button>
      </div>
    </form>
  </div>
  <p class="auth-note">Traffic Intelligence · instrument panel for a YOLO detection pipeline</p>
</div>

<script src="/js/config.js"></script>
<script>
(function () {
  "use strict";
  var mode = "login";
  var title = document.getElementById("authTitle");
  var submit = document.getElementById("authSubmit");
  var switchBtn = document.getElementById("switchMode");
  var switchLabel = document.getElementById("switchLabel");
  var errorBox = document.getElementById("authError");

  function setMode(next) {
    mode = next;
    if (mode === "login") {
      title.textContent = "Sign in";
      submit.textContent = "Sign in";
      switchLabel.textContent = "No account yet?";
      switchBtn.textContent = "Create one";
    } else {
      title.textContent = "Create account";
      submit.textContent = "Sign up";
      switchLabel.textContent = "Already have an account?";
      switchBtn.textContent = "Sign in instead";
    }
    errorBox.style.display = "none";
  }

  switchBtn.addEventListener("click", function () {
    setMode(mode === "login" ? "signup" : "login");
  });

  document.getElementById("authForm").addEventListener("submit", function (evt) {
    evt.preventDefault();
    errorBox.style.display = "none";
    submit.disabled = true;
    fetch(window.tiApiUrl("/api/auth/" + mode), {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      credentials: "include",
      body: JSON.stringify({
        username: document.getElementById("username").value,
        password: document.getElementById("password").value,
      }),
    }).then(function (resp) {
      return resp.json().then(function (body) {
        if (!resp.ok || body.success === false) throw new Error(body.error || "Failed.");
        window.location.href = "/";
      });
    }).catch(function (err) {
      errorBox.textContent = err.message;
      errorBox.style.display = "block";
    }).finally(function () {
      submit.disabled = false;
    });
  });
})();
</script>
</body>
</html>
