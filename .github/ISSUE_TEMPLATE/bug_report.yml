name: Bug report
description: Report a reproducible problem in the Traffic Intelligence project.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please provide as much detail as possible.

  - type: textarea
    id: summary
    attributes:
      label: Bug summary
      description: What is happening?
      placeholder: The app crashes when uploading a video...
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: List the exact steps needed to reproduce the issue.
      placeholder: |
        1. Start the backend
        2. Open the dashboard
        3. Upload a sample video
        4. Observe the error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead?
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include OS, Python version, dependency versions, and any relevant config.
      placeholder: |
        - OS: Windows 11
        - Python: 3.12.3
        - Browser: Chrome 127
        - Commit: <sha>
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs / screenshots
      description: Attach logs, stack traces, or screenshots if available.
